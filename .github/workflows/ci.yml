name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogo_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=catalogo_testes;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Testes (xUnit) com cobertura (coverlet)
        run: >
          dotnet test --no-build -c Release
          --logger "trx;LogFileName=resultados.trx" --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Relatório de cobertura (ReportGenerator)
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: backend/TestResults/**/coverage.cobertura.xml
          targetdir: backend/TestResults/cobertura
          reporttypes: Html;JsonSummary;MarkdownSummaryGithub
          assemblyfilters: +CatalogoCursos.Api
      - name: Resumo dos testes e da cobertura
        if: always()
        run: |
          for f in $(find . -name '*.trx'); do
            linha=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$linha" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passou=$(echo "$linha" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            falhou=$(echo "$linha" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "::notice title=Testes do back-end::${passou}/${total} aprovados, ${falhou} falharam"
            echo "### Testes do back-end: ${passou}/${total} aprovados, ${falhou} falharam" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ -f TestResults/cobertura/Summary.json ]; then
            cobertura=$(python3 -c "import json; s=json.load(open('TestResults/cobertura/Summary.json'))['summary']; print('linhas', str(s['linecoverage'])+'%', '· ramos', str(s['branchcoverage'])+'%')")
            echo "::notice title=Cobertura do back-end::${cobertura}"
            cat TestResults/cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publicar resultados e cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-testes-e-cobertura
          path: |
            backend/TestResults/**/*.trx
            backend/TestResults/cobertura

  frontend:
    name: Front-end (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Testes (Vitest + Testing Library) com cobertura
        run: npm run test:cobertura
      - name: Resumo da cobertura
        if: always()
        run: |
          python3 -c "import json; t=json.load(open('coverage/coverage-summary.json'))['total']; print('::notice title=Cobertura do front-end::linhas', str(t['lines']['pct'])+'%', '· ramos', str(t['branches']['pct'])+'%')"
          python3 -c "import json; t=json.load(open('coverage/coverage-summary.json'))['total']; print('### Cobertura do front-end (Vitest): linhas', str(t['lines']['pct'])+'%, funções', str(t['functions']['pct'])+'%, ramos', str(t['branches']['pct'])+'%')" >> "$GITHUB_STEP_SUMMARY"
      - name: Build (TypeScript + Vite)
        run: npm run build
      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-cobertura
          path: frontend/coverage

  e2e:
    name: E2E (Docker Compose + Playwright + axe)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Subir banco, API e front-end
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verificar integração (API, banco e front-end via Nginx)
        run: |
          set -e
          for i in $(seq 1 30); do curl -fsS http://localhost:5080/health && break; sleep 3; done
          curl -fsS http://localhost:5080/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          total=$(curl -fsS "http://localhost:8080/api/cursos?tamanhoPagina=50" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          test "$total" -ge 6
          echo "::notice title=Docker Compose::Aplicação completa no ar (API + banco + front-end), $total cursos"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Instalar Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Testes E2E e de acessibilidade (desktop e mobile)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Resumo dos testes E2E
        if: always()
        working-directory: e2e
        run: test -f test-results/resultados.json && python3 resumo.py || true
      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-playwright
          path: e2e/playwright-report
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

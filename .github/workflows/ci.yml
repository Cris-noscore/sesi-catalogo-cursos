name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogo_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=catalogo_testes;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=resultados.trx" --logger "console;verbosity=normal"
      - name: Resumo dos testes
        if: always()
        run: |
          for f in $(find . -name '*.trx'); do
            linha=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$linha" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passou=$(echo "$linha" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            falhou=$(echo "$linha" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "::notice title=Testes do back-end::${passou}/${total} aprovados, ${falhou} falharam"
            echo "### Testes do back-end: ${passou}/${total} aprovados, ${falhou} falharam" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-testes-backend
          path: backend/**/TestResults/*.trx

  frontend:
    name: Front-end (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker:
    name: Docker Compose (teste ponta a ponta)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Subir banco, API e front-end
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verificar API, front-end e integração via Nginx
        run: |
          set -e
          for i in $(seq 1 30); do curl -fsS http://localhost:5080/health && break; sleep 3; done
          curl -fsS http://localhost:5080/health
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          total=$(curl -fsS "http://localhost:8080/api/cursos?tamanhoPagina=50" | python3 -c "import json,sys; print(json.load(sys.stdin)['total'])")
          echo "Cursos retornados via front-end/Nginx: $total"
          test "$total" -ge 6
          curl -fsS -o /dev/null http://localhost:8080/cursos/1   # rota SPA
          echo "::notice title=Docker Compose::Aplicação completa no ar (API + banco + front-end), $total cursos"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (.NET 10 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catalogo_testes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=catalogo_testes;Username=postgres;Password=postgres
      DOTNET_NOLOGO: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: backend/global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=resultados.trx" --logger "console;verbosity=normal"
      - name: Resumo dos testes
        if: always()
        run: |
          for f in $(find . -name '*.trx'); do
            linha=$(grep -o '<Counters [^>]*>' "$f")
            total=$(echo "$linha" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passou=$(echo "$linha" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            falhou=$(echo "$linha" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "::notice title=Testes do back-end::${passou}/${total} aprovados, ${falhou} falharam"
            echo "### Testes do back-end: ${passou}/${total} aprovados, ${falhou} falharam" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultados-testes-backend
          path: backend/**/TestResults/*.trx

  frontend:
    name: Front-end (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
